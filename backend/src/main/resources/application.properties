spring.application.name=hapi-fhir-demo
server.port=8085

# http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

springdoc.show-actuator=false

# ── Primary datasource (auth, consent, identity, audit) ──
spring.datasource.fhir-main.jdbc-url=jdbc:postgresql://localhost:5432/fhir_main
spring.datasource.fhir-main.username=fhir_user
spring.datasource.fhir-main.password=fhir_pass
spring.datasource.fhir-main.driver-class-name=org.postgresql.Driver

# ── Hospital A datasource ────────────────────────────────
spring.datasource.hospital-a.jdbc-url=jdbc:postgresql://localhost:5432/hospital_a_db
spring.datasource.hospital-a.username=fhir_user
spring.datasource.hospital-a.password=fhir_pass
spring.datasource.hospital-a.driver-class-name=org.postgresql.Driver

# ── Hospital B datasource ────────────────────────────────
spring.datasource.hospital-b.jdbc-url=jdbc:postgresql://localhost:5432/hospital_b_db
spring.datasource.hospital-b.username=fhir_user
spring.datasource.hospital-b.password=fhir_pass
spring.datasource.hospital-b.driver-class-name=org.postgresql.Driver

# update: creates tables on first run, then alters on schema changes (safe for dev)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Use a 256-bit (32+ char) base64-encoded secret in prod.
jwt.secret=change-me-to-a-256-bit-base64-secret-in-prod-at-least-32-chars
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=604800
