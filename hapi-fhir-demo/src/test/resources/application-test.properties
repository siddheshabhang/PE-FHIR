# Test profile — uses H2 in-memory so mvn test does not need a running PostgreSQL instance
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT config for test context
jwt.secret=test-secret-key-for-unit-tests-minimum-32-chars-long
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=604800
