spring.application.name=hapi-fhir-demo
server.port=8085

# http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

springdoc.show-actuator=false

spring.datasource.url=jdbc:postgresql://localhost:5432/fhir_demo
spring.datasource.username=fhir_user
spring.datasource.password=fhir_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# update: creates tables on first run, then alters on schema changes (safe for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Use a 256-bit (32+ char) base64-encoded secret in prod.
jwt.secret=change-me-to-a-256-bit-base64-secret-in-prod-at-least-32-chars
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=604800
