spring.application.name=hapi-fhir-demo

# Swagger UI path — open this in browser after running the app:
# http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# Makes all endpoints show up in Swagger without extra annotations
springdoc.show-actuator=false

# ── PostgreSQL Datasource ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/fhir_demo
spring.datasource.username=fhir_user
spring.datasource.password=fhir_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update: creates tables on first run, then alters on schema changes (safe for dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect